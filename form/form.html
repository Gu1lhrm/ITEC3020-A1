<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation form</title>

    <link rel="stylesheet" href="../css/form.css">
</head>
<body>
<!-- Trigger Button on the main page -->
    <button id="openModalBtn" class="primary-btn">Book a Table</button>

    <!-- The Modal Overlay -->
    <div id="reservationModal" class="modal-overlay hidden">
    <div class="modal-content">
        <button id="closeModalBtn" class="close-btn">&times;</button>
        
        <h2>Book a Table</h2>
        
        <div class="input-group">
        <label for="date">Date</label>
        <input type="date" id="date" value="2026-11-09">
        </div>

        <div class="input-group">
        <label>Party Size</label>
        <div class="party-size-selector">
            <button class="size-btn">1</button>
            <button class="size-btn active">2</button>
            <button class="size-btn">3</button>
            <button class="size-btn">4</button>
            <button class="size-btn">5+</button>
        </div>
        </div>

        <div class="time-slots-container">
        <label>Available Times</label>
        <!-- Time slots will be injected here by JavaScript -->
        <div id="timeGrid" class="time-grid"></div>
        </div>

        <div class="email-group">
            <label>Email Address</label>
            <input type="email" id="notifyEmail" placeholder="Enter your email address" required>
        </div>

        <div class="notify-section">
        <p class="scarcity-text">Can't find your preferred time?</p>
        <button id="notifyBtn" class="action-btn notify">Set a Notify Alert</button>
        </div>
    </div>
    </div>

    <script src="../javascript/script.js"></script>
</body>
</html>
